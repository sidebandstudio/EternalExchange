plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

// Upstream ProjectE keeps its API in a separate source set (src/api/java).
// We compile it as part of main to keep the build simple while preserving the layout.
sourceSets.main.java.srcDir 'src/api/java'

loom {
	accessWidenerPath = file("src/main/resources/projecte.accesswidener")

	mods {
		"projecte" {
			sourceSet sourceSets.main
		}
	}

	runs {
		client {
			client()
			ideConfigGenerated true
			runDir "run"
		}
		server {
			server()
			ideConfigGenerated true
			runDir "run/server"
		}
		// Auto-joins the PortTest world; used for scripted in-game smoke tests
		clientAuto {
			inherit client
			client()
			programArgs "--quickPlaySingleplayer", "PortTest"
			ideConfigGenerated false
			runDir "run"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Mojang official mappings: same names as upstream NeoForge codebase, keeps the port diffable
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// javax.annotation (JSR-305), provided by NeoForge but not Fabric; upstream sources use it
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"

	// TOML config backend; same library NeoForge uses, so upstream config files stay compatible
	implementation "com.electronwill.night-config:core:${project.night_config_version}"
	implementation "com.electronwill.night-config:toml:${project.night_config_version}"
	include "com.electronwill.night-config:core:${project.night_config_version}"
	include "com.electronwill.night-config:toml:${project.night_config_version}"

	// EMC math (BigFraction); provided by NeoForge upstream, bundled here
	implementation "org.apache.commons:commons-math3:3.6.1"
	include "org.apache.commons:commons-math3:3.6.1"

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

test {
	useJUnitPlatform()
}
